# Notes Etc — local/POC stack: one app container (API + web) plus Postgres.
# The app publishes ONE port; the web server inside proxies /api/v1, /docs
# and /healthz to the API process. For production, put real secrets in .env
# and bind the storage volume to something you back up.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: notesetc
      POSTGRES_PASSWORD: notesetc
      POSTGRES_DB: notesetc
    volumes:
      - notesetc_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notesetc -d notesetc']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: mlarritt/notesetc:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      WEB_ORIGIN: http://localhost:3100
      DATABASE_URL: postgresql://notesetc:notesetc@db:5432/notesetc?schema=public
      # Demo-only secrets — OVERRIDE for any real deployment.
      MASTER_ENCRYPTION_KEY: ${MASTER_ENCRYPTION_KEY:-ZGV2LW9ubHktMzJieXRlLWtleS1wbGFjZWhvbGRlciE=}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me}
      BREAKGLASS_ADMIN_EMAIL: ${BREAKGLASS_ADMIN_EMAIL:-admin@example.com}
      BREAKGLASS_ADMIN_PASSWORD: ${BREAKGLASS_ADMIN_PASSWORD:-change-me-please-12+}
      STORAGE_DIR: /app/storage
      RUN_SEED: ${RUN_SEED:-false}
    ports:
      - '3100:3000'
    volumes:
      - notesetc_storage:/app/storage # attachments, persistent
    healthcheck:
      test:
        ['CMD', 'node', '-e', "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

volumes:
  notesetc_db:
  notesetc_storage:
